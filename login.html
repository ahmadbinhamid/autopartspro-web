<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Auto Parts Pro</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body class="auth-body">

<main class="auth-wrap">
  <div class="auth-card">
    <a class="auth-brand" href="index.html">
      <img src="assets/logo-mark.svg" alt="" class="logo-mark">
      <span>Auto Parts Pro</span>
    </a>

    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Log in to manage your inventory, orders and channels.</p>

    <!-- NOTE: this form has no backend. It does not store, log or send
         anything anywhere. Point `action`/`method` at your real auth
         endpoint over HTTPS (and add a CSRF token) to make it live. -->
    <form class="auth-form" id="loginForm" novalidate>
      <div class="f-row">
        <label for="loginEmail">Work email
          <input type="email" id="loginEmail" name="email" placeholder="you@yourshop.com"
                 autocomplete="username" required>
        </label>
      </div>

      <div class="f-row">
        <label for="loginPassword">Password
          <span class="auth-field">
            <input type="password" id="loginPassword" name="password" placeholder="••••••••"
                   autocomplete="current-password" required>
            <button type="button" class="auth-reveal" id="revealPw" aria-pressed="false"
                    aria-label="Show password">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </span>
        </label>
      </div>

      <div class="auth-row">
        <label class="auth-check">
          <input type="checkbox" name="remember" id="remember">
          <span>Keep me logged in</span>
        </label>
      </div>

      <button type="submit" class="btn-submit">Log in</button>

      <p class="auth-note" id="loginNote" role="status" aria-live="polite"></p>
    </form>

    <p class="auth-foot">
      Access is provisioned by your account administrator.
      <a href="index.html">Back to site</a>
    </p>
  </div>
</main>

<script>
/* Client-side validation only. Deliberately does NOT pretend to sign
   anyone in — with no auth endpoint wired up, a fake "success" screen
   would be misleading. */
(function () {
  var form = document.getElementById('loginForm');
  var note = document.getElementById('loginNote');
  var email = document.getElementById('loginEmail');
  var pw = document.getElementById('loginPassword');
  if (!form) return;

  function fail(msg, field) {
    note.textContent = msg;
    note.className = 'auth-note is-error';
    if (field) field.focus();
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    note.textContent = '';
    note.className = 'auth-note';

    if (!email.value.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value.trim())) {
      return fail('Enter a valid work email address.', email);
    }
    if (!pw.value) {
      return fail('Enter your password.', pw);
    }

    note.textContent = 'Sign-in is not connected to an authentication service yet, so nothing was submitted.';
    note.className = 'auth-note is-info';
  });

  // Show / hide password
  var reveal = document.getElementById('revealPw');
  if (reveal) {
    reveal.addEventListener('click', function () {
      var showing = pw.type === 'text';
      pw.type = showing ? 'password' : 'text';
      reveal.setAttribute('aria-pressed', String(!showing));
      reveal.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
      reveal.classList.toggle('is-on', !showing);
    });
  }
})();
</script>
</body>
</html>
