services:
  autopartspro-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_LOGIN_URL: ${VITE_LOGIN_URL:-https://app.autopartspro.au/login}
    hostname: autopartspro-web
    restart: unless-stopped
    networks:
      - pha-net

networks:
  pha-net:
    external: true
